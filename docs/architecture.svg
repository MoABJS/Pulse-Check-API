<svg width="600" height="490" viewBox="0 0 600 490" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Layered architecture diagram</title>
  <desc>Four-layer architecture showing Routes, Controllers, Services, and Store from top to bottom. Each layer only communicates with the layer directly below it.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- HTTP Request pill -->
  <rect x="170" y="18" width="260" height="40" rx="20" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="300" y="34" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#374151">HTTP Request</text>
  <text x="300" y="50" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9ca3af">from device or client</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="58" x2="300" y2="82" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Routes box -->
  <rect x="100" y="86" width="400" height="68" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="112" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Routes</text>
  <text x="300" y="132" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#3b82f6">Maps URLs to controller functions — no logic here</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="154" x2="300" y2="178" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Controllers box -->
  <rect x="100" y="182" width="400" height="68" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="300" y="208" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#6d28d9">Controllers</text>
  <text x="300" y="228" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b5cf6">Reads req, writes res — decides HTTP status codes</text>

  <!-- Arrow 3 -->
  <line x1="300" y1="250" x2="300" y2="274" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Services box -->
  <rect x="100" y="278" width="400" height="68" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="304" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#065f46">Services</text>
  <text x="300" y="324" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#10b981">Business logic — timers, alerts, state transitions</text>

  <!-- Arrow 4 -->
  <line x1="300" y1="346" x2="300" y2="370" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Store box -->
  <rect x="100" y="374" width="400" height="68" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="400" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#92400e">Store</text>
  <text x="300" y="420" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f59e0b">In-memory Map — raw get, save, and find operations</text>

  <!-- Rule note -->
  <text x="300" y="466" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9ca3af" font-style="italic">Each layer only talks to the layer directly below it</text>
</svg>
